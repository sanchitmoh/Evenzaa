spring.application.name=EvenzaBackend

# Database Configuration (override with environment variables for deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/evenza}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Optional: Hibernate/JPA Configuration
# Let Spring/Hibernate infer the correct driver and dialect from the JDBC URL
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.jackson.default-property-inclusion=ALWAYS
server.port=${SERVER_PORT:8080}
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG


